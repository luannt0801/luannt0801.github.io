---
layout: default
title: Luan Nguyen's Blog - Homepage
---

<div class="welcome-page">
    <div class="slideshow-container">
        <div class="mySlides"><img src="/assets/imgs/slide1.jpg" alt="Slide 1"></div>
        <div class="mySlides"><img src="/assets/imgs/slide2.jpg" loading="lazy" alt="Slide 2"></div>
        <div class="mySlides"><img src="/assets/imgs/slide3.jpg" loading="lazy" alt="Slide 3"></div>
        <div class="mySlides"><img src="/assets/imgs/slide4.jpg" loading="lazy" alt="Slide 4"></div>

        <a class="prev" onclick="plusSlides(-1)" aria-label="Previous slide">❮</a>
        <a class="next" onclick="plusSlides(1)" aria-label="Next slide">❯</a>

        <div class="dot-container">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
        </div>
    </div>
</div>

<section class="feed">
    <h1 class="feed__heading">Articles</h1>
    <ul class="post-list">
        {% for post in site.posts limit: 20 %}
        {% include post-card.html post=post %}
        {% endfor %}
    </ul>
</section>
