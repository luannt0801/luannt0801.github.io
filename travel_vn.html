    <script>
        function addUserLocation(map) {
            if (navigator.geolocation) {
                // Dùng watchPosition để cập nhật liên tục và chính xác hơn
                navigator.geolocation.watchPosition(function (position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;

                    // Nếu đã có marker rồi thì di chuyển, không tạo mới
                    if (window.userMarker) {
                        window.userMarker.setLatLng([lat, lon]);
                    } else {
                        // Tạo icon hình ảnh custom
                        var userIcon = L.icon({
                            iconUrl: "pngtree-cute-boy-wearing-a-hat-during-the-vietnamese-spring-festival-png-image_2977787-removebg-preview.png", // ảnh custom
                            iconSize: [50, 50],   // kích thước
                            iconAnchor: [25, 50], // điểm neo (chân icon)
                            popupAnchor: [0, -50] // vị trí popup
                        });

                        window.userMarker = L.marker([lat, lon], { icon: userIcon }).addTo(map)
                            .bindPopup("📍 Dudu and Bubu are here!").openPopup();

                        map.setView([lat, lon], 16); // zoom sát hơn để chính xác
                    }

                }, function (error) {
                    console.log("Can't get the location:", error);
                }, {
                    enableHighAccuracy: true, // ép dùng GPS
                    maximumAge: 0,            // không dùng cache
                    timeout: 10000            // timeout 10s
                });
            } else {
                alert("Browser does not support geolocation.");
            }
        }

        // Lấy mapId mà folium sinh ra (vd: map_xxxxx)
        document.addEventListener("DOMContentLoaded", function () {
            var mapId = Object.keys(window).find(k => k.startsWith("map_"));
            if (mapId) {
                addUserLocation(window[mapId]);
            }
        });
    </script>

    function toBase64Utf8(str) {
        return btoa(unescape(encodeURIComponent(str)));
    }

    function applyLanguage(lang) {
        mapLangRegistry.forEach(function (item) {
            var t = item[lang];
            item.marker.setTooltipContent(
                `<div>
                     ` + t.title + `
                 </div>`
            );

            var popup = item.marker.getPopup();
            if (popup) {
                var html = "\n    <h4>" + t.title + "</h4><p>" + t.desc + "</p>";
                var iframe = document.createElement("iframe");
                iframe.src = "data:text/html;charset=utf-8;base64," + toBase64Utf8(html);
                iframe.width = 300;
                iframe.height = 150;
                iframe.style.border = "none !important";
                popup.setContent(iframe);
            }
        });

        localStorage.setItem("danang_map_lang", lang);

        var viBtn = document.getElementById("lang-vi");
        var enBtn = document.getElementById("lang-en");
        if (viBtn && enBtn) {
            viBtn.classList.toggle("active", lang === "vi");
            enBtn.classList.toggle("active", lang === "en");
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        var viBtn = document.getElementById("lang-vi");
        var enBtn = document.getElementById("lang-en");
        if (viBtn) viBtn.addEventListener("click", function () { applyLanguage("vi"); });
        if (enBtn) enBtn.addEventListener("click", function () { applyLanguage("en"); });

        var savedLang = localStorage.getItem("danang_map_lang") || "vi";
        applyLanguage(savedLang);

        var allLatLngs = mapLangRegistry.map(function (item) {
            return item.marker.getLatLng();
        });
        map_a517b04ac924eb5ccc272d634592a607.fitBounds(L.latLngBounds(allLatLngs), { padding: [30, 30] });
    });
