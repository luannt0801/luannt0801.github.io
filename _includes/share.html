<div class="share" aria-label="Share">
    <button type="button" class="share__btn" data-share="copy" aria-label="Copy link" title="Copy link"><i class="fas fa-link" aria-hidden="true"></i></button>
    <a class="share__btn" data-share="x" href="#" target="_blank" rel="noopener" aria-label="Share on X" title="Share on X"><i class="fab fa-twitter" aria-hidden="true"></i></a>
    <a class="share__btn" data-share="linkedin" href="#" target="_blank" rel="noopener" aria-label="Share on LinkedIn" title="Share on LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
    <a class="share__btn" data-share="facebook" href="#" target="_blank" rel="noopener" aria-label="Share on Facebook" title="Share on Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
</div>
